<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多模型配置 - 视频转文字工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 状态消息淡入动画 */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        #statusMessage:not(.hidden) {
            animation: fadeInDown 0.3s ease-out;
        }
        
        /* 自定义滚动条样式 */
        #modelsList::-webkit-scrollbar {
            width: 8px;
        }
        
        #modelsList::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        
        #modelsList::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        
        #modelsList::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .prompt-editor {
            min-height: clamp(24rem, 52vh, 48rem);
            line-height: 1.65;
            resize: vertical;
        }

        @media (max-width: 640px) {
            .prompt-editor {
                min-height: 20rem;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <!-- Header -->
        <div class="mb-6">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold text-gray-800">
                    <i class="fas fa-cogs mr-3 text-indigo-600"></i>多模型配置管理
                </h1>
                <button onclick="window.close(); setTimeout(()=>location.href='/',200)" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition-colors">
                    <i class="fas fa-times mr-2"></i>关闭页面
                </button>
            </div>
            <p class="text-gray-600 mt-2">配置多个 AI 模型，快速切换使用</p>
        </div>

        <!-- Saved Model Selector -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <label class="text-lg font-semibold text-gray-800">
                    <i class="fas fa-list mr-2 text-indigo-600"></i>已保存模型清单
                </label>
                <div class="flex items-center gap-3">
                    <button onclick="startAddModel()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors">
                        <i class="fas fa-plus mr-2"></i>增加模型
                    </button>
                    <button onclick="showAddModelModal()" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition-colors">
                        <i class="fas fa-building-circle-plus mr-2"></i>添加供应商
                    </button>
                    <button onclick="showEditProviderModal()" class="px-4 py-2 border border-indigo-200 text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">
                        <i class="fas fa-pen mr-2"></i>编辑供应商
                    </button>
                    <button onclick="showDeleteProviderModal()" class="px-4 py-2 border border-red-200 text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                        <i class="fas fa-trash mr-2"></i>删除供应商
                    </button>
                </div>
            </div>
            
            <select id="modelSelector" onchange="loadModelConfig()" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                <option value="">-- 请选择已保存模型 --</option>
            </select>
        </div>

        <!-- Model Configuration Form -->
        <div id="configForm" class="bg-white rounded-2xl shadow-xl p-8 hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Left: Form Fields -->
                <form id="modelForm" class="space-y-6">
                <!-- Provider Selector -->
                <div>
                    <label for="providerSelector" class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-building mr-2 text-indigo-600"></i>选择供应商
                        <span class="text-red-500">*</span>
                    </label>
                    <select
                        id="providerSelector"
                        onchange="loadProviderConfig()"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    >
                        <option value="">-- 请先添加供应商 --</option>
                    </select>
                </div>

                <!-- Provider Alias -->
                <div>
                    <label for="modelAlias" class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-tag mr-2 text-indigo-600"></i>供应商别名
                        <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="modelAlias" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="例如：万量、OpenAI官方"
                        required
                    >
                    <p class="text-xs text-gray-500 mt-1">
                        <i class="fas fa-info-circle mr-1"></i>用于识别 API 供应商，保存模型时会显示为“供应商别名-模型名”
                    </p>
                </div>

                <!-- API Key -->
                <div>
                    <label for="apiKey" class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-key mr-2 text-indigo-600"></i>API Key
                        <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="apiKey" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="sk-..."
                        required
                    >
                </div>

                <!-- Base URL -->
                <div>
                    <label for="baseUrl" class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-link mr-2 text-indigo-600"></i>Base URL
                        <span class="text-red-500">*</span>
                    </label>
                    <div class="flex gap-2">
                        <input 
                            type="url" 
                            id="baseUrl" 
                            class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            placeholder="https://api.openai.com/v1"
                            required
                        >
                        <button 
                            type="button" 
                            onclick="fetchModelsList()" 
                            id="fetchModelsBtn"
                            class="px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors whitespace-nowrap text-sm"
                        >
                            <i class="fas fa-download mr-1"></i>获取模型
                        </button>
                    </div>
                </div>

                <!-- Model Provider -->
                <div>
                    <label for="modelProvider" class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-server mr-2 text-indigo-600"></i>接口类型
                    </label>
                    <select 
                        id="modelProvider" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    >
                        <option value="openai" selected>OpenAI</option>
                        <option value="openai-completion">OpenAI Completion</option>
                        <option value="azure">Azure OpenAI</option>
                        <option value="anthropic">Anthropic (Claude)</option>
                        <option value="qwen">通义千问</option>
                        <option value="zhipu">智谱 AI</option>
                        <option value="custom">自定义</option>
                    </select>
                </div>

                <!-- Model ID -->
                <div>
                    <label for="modelName" class="block text-sm font-semibold text-gray-700 mb-2">
                        <i class="fas fa-robot mr-2 text-indigo-600"></i>模型 ID
                        <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="modelName" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="gpt-4o"
                        autocomplete="off"
                        spellcheck="false"
                        required
                    >
                    <p class="text-xs text-gray-500 mt-1">
                        <i class="fas fa-info-circle mr-1"></i>可手动输入；从右侧列表选择后会自动填入这里
                    </p>
                </div>

                <!-- Generation Settings -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-3">
                        <i class="fas fa-sliders-h mr-2 text-indigo-600"></i>生成参数
                    </label>
                    <div class="grid grid-cols-2 gap-4">
                        <!-- Max Tokens -->
                        <div>
                            <label for="maxTokens" class="block text-xs font-medium text-gray-600 mb-1">Max Tokens（最大生成长度）</label>
                            <input 
                                type="number" 
                                id="maxTokens" 
                                min="1" 
                                max="1000000" 
                                class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm"
                                placeholder="留空则由模型决定"
                            >
                            <p class="text-xs text-gray-400 mt-1">不同模型支持的上限不同</p>
                        </div>
                        <!-- Temperature -->
                        <div>
                            <label for="temperature" class="block text-xs font-medium text-gray-600 mb-1">Temperature（随机性）</label>
                            <input
                                type="number"
                                id="temperature"
                                min="0" max="2" step="0.1"
                                class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm"
                                placeholder="留空则由模型决定"
                            >
                            <p class="text-xs text-gray-400 mt-1">仅在供应商和模型明确支持时填写</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mt-4">
                        <div>
                            <label for="apiMode" class="block text-xs font-medium text-gray-600 mb-1">API 模式</label>
                            <select id="apiMode" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm">
                                <option value="auto">自动（优先 Responses，不支持时回退 Chat）</option>
                                <option value="responses">Responses API</option>
                                <option value="chat">Chat Completions</option>
                            </select>
                        </div>
                        <div>
                            <label for="reasoningEffort" class="block text-xs font-medium text-gray-600 mb-1">推理强度</label>
                            <select id="reasoningEffort" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm">
                                <option value="auto">自动（由模型决定）</option>
                                <option value="none">none</option>
                                <option value="minimal">minimal</option>
                                <option value="low">low</option>
                                <option value="medium">medium</option>
                                <option value="high">high</option>
                                <option value="xhigh">xhigh</option>
                                <option value="max">max</option>
                            </select>
                        </div>
                        <div>
                            <label for="promptCacheTtl" class="block text-xs font-medium text-gray-600 mb-1">提示词缓存 TTL</label>
                            <select id="promptCacheTtl" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm">
                                <option value="auto">自动（由服务端决定）</option>
                                <option value="off">关闭显式 TTL</option>
                                <option value="30m">30m</option>
                                <option value="12h">12h</option>
                            </select>
                        </div>
                        <div>
                            <label for="serviceTier" class="block text-xs font-medium text-gray-600 mb-1">Service Tier</label>
                            <select id="serviceTier" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm">
                                <option value="auto">自动</option>
                                <option value="standard">standard</option>
                                <option value="priority">priority</option>
                                <option value="flex">flex</option>
                            </select>
                        </div>
                    </div>
                </div>

                </form>

                <!-- Right: Models List -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-sm font-semibold text-gray-700">
                            <i class="fas fa-list mr-2 text-indigo-600"></i>可用模型列表
                        </label>
                        <span id="modelsCount" class="text-xs text-gray-500"></span>
                    </div>
                    <!-- Search Box -->
                    <div class="mb-2">
                        <input 
                            type="text" 
                            id="modelSearch" 
                            placeholder="🔍 搜索模型..." 
                            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            oninput="filterModels()"
                        >
                    </div>
                    <div class="border border-gray-300 rounded-lg overflow-hidden" style="height: 480px;">
                        <!-- Models List Container -->
                        <div id="modelsList" class="h-full overflow-y-auto">
                            <div class="flex items-center justify-center h-full text-gray-400">
                                <div class="text-center">
                                    <i class="fas fa-inbox text-4xl mb-2"></i>
                                    <p class="text-sm">请填写 API Key 和 Base URL，<br>然后点击"获取模型"按钮，或在左侧手动填写模型 ID</p>
                                </div>
                            </div>
                        </div>
                        <!-- Pagination -->
                        <div id="modelsPagination" class="hidden border-t border-gray-300 bg-gray-50 px-4 py-2 flex items-center justify-between">
                            <button onclick="prevModelsPage()" id="prevPageBtn" class="px-3 py-1 text-sm text-indigo-600 hover:text-indigo-800 disabled:text-gray-400 disabled:cursor-not-allowed" disabled>
                                <i class="fas fa-chevron-left mr-1"></i>上一页
                            </button>
                            <span id="pageInfo" class="text-sm text-gray-600"></span>
                            <button onclick="nextModelsPage()" id="nextPageBtn" class="px-3 py-1 text-sm text-indigo-600 hover:text-indigo-800 disabled:text-gray-400 disabled:cursor-not-allowed" disabled>
                                下一页<i class="fas fa-chevron-right ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Full-width Prompt Editor -->
            <section id="promptEditorSection" class="mt-8 pt-8 border-t border-gray-200">
                <div class="flex flex-col gap-3 mb-3 sm:flex-row sm:items-center sm:justify-between">
                    <label for="customPrompt" class="text-sm font-semibold text-gray-700">
                        <i class="fas fa-comment-dots mr-2 text-indigo-600"></i>自定义提示词
                        <span class="text-gray-500 text-xs font-normal ml-2">(可选)</span>
                    </label>
                    <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
                        <span class="text-xs text-gray-400">默认模板</span>
                        <button
                            type="button"
                            id="presetRestructureBtn"
                            onclick="usePromptPreset('restructure')"
                            class="text-indigo-600 hover:text-indigo-800 text-sm font-medium"
                        >
                            整理重排
                        </button>
                        <button
                            type="button"
                            id="presetFaithfulBtn"
                            onclick="usePromptPreset('faithful')"
                            class="text-indigo-600 hover:text-indigo-800 text-sm font-medium"
                        >
                            尊重原文
                        </button>
                    </div>
                </div>
                <p class="text-xs text-gray-600 mb-3">
                    <i class="fas fa-info-circle mr-1"></i>使用 <code class="bg-gray-100 px-1 py-0.5 rounded text-xs">{transcript}</code> 作为占位符。点选模板后仍可再改。
                </p>
                <textarea
                    id="customPrompt"
                    form="modelForm"
                    rows="18"
                    class="prompt-editor w-full px-4 py-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent font-mono text-sm"
                    placeholder="留空则使用「整理重排」..."
                ></textarea>
                <p class="text-xs text-gray-500 mt-2">
                    为此模型设置专属的提示词。留空则使用「整理重排」。编辑区域可从右下角继续拉高。
                </p>
            </section>

            <!-- Status Message - 内联显示 -->
            <div id="statusMessage" class="hidden mt-6">
                <div class="p-4 rounded-lg border-l-4 flex items-center justify-between">
                    <div class="flex items-center">
                        <i id="statusIcon" class="fas mr-3 text-xl"></i>
                        <p id="statusText" class="font-medium"></p>
                    </div>
                    <button type="button" onclick="hideStatus()" class="ml-4 text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex space-x-4 pt-6">
                <button 
                    type="button" 
                    onclick="testConnection()" 
                    class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg transition-colors"
                    id="testBtn"
                >
                    <i class="fas fa-plug mr-2"></i>测试连接
                </button>
                <button 
                    type="button" 
                    onclick="document.getElementById('modelForm').requestSubmit()"
                    class="flex-1 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition-colors"
                    id="saveModelBtn"
                >
                    <i class="fas fa-save mr-2"></i>保存模型配置
                </button>
                <button 
                    type="button" 
                    onclick="deleteModel()" 
                    class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition-colors"
                    id="deleteModelBtn"
                >
                    <i class="fas fa-trash mr-2"></i>删除模型配置
                </button>
            </div>
        </div>

    </div>

    <!-- Add Provider Modal -->
    <div id="addModelModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-semibold text-gray-800 mb-4">
                <i class="fas fa-plus-circle mr-2 text-green-600"></i>添加供应商
            </h3>
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">供应商别名</label>
                <input 
                    type="text" 
                    id="newModelAlias" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                    placeholder="例如：万量"
                >
            </div>
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">API Key</label>
                <input
                    type="text"
                    id="newProviderApiKey"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                    placeholder="sk-..."
                >
            </div>
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Base URL</label>
                <input
                    type="url"
                    id="newProviderBaseUrl"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                    placeholder="https://api.openai.com/v1"
                >
            </div>
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">接口类型</label>
                <select
                    id="newProviderType"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                >
                    <option value="openai" selected>OpenAI</option>
                    <option value="openai-completion">OpenAI Completion</option>
                    <option value="azure">Azure OpenAI</option>
                    <option value="anthropic">Anthropic (Claude)</option>
                    <option value="qwen">通义千问</option>
                    <option value="zhipu">智谱 AI</option>
                    <option value="custom">自定义</option>
                </select>
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="hideAddModelModal()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                    取消
                </button>
                <button onclick="addNewModel()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                    保存供应商
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Provider Modal -->
    <div id="editProviderModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-semibold text-gray-800 mb-4">
                <i class="fas fa-pen mr-2 text-indigo-600"></i>编辑供应商
            </h3>
            <div class="mb-4">
                <label for="editProviderSelector" class="block text-sm font-semibold text-gray-700 mb-2">选择供应商</label>
                <select
                    id="editProviderSelector"
                    onchange="fillEditProviderFields(this.value)"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                >
                    <option value="">-- 请选择供应商 --</option>
                </select>
            </div>
            <div class="mb-4">
                <label for="editProviderAlias" class="block text-sm font-semibold text-gray-700 mb-2">供应商别名</label>
                <input
                    type="text"
                    id="editProviderAlias"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                    placeholder="例如：万量"
                >
            </div>
            <div class="mb-4">
                <label for="editProviderApiKey" class="block text-sm font-semibold text-gray-700 mb-2">API Key</label>
                <input
                    type="text"
                    id="editProviderApiKey"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                    placeholder="sk-..."
                >
            </div>
            <div class="mb-4">
                <label for="editProviderBaseUrl" class="block text-sm font-semibold text-gray-700 mb-2">Base URL</label>
                <input
                    type="url"
                    id="editProviderBaseUrl"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                    placeholder="https://api.openai.com/v1"
                >
            </div>
            <div class="mb-4">
                <label for="editProviderType" class="block text-sm font-semibold text-gray-700 mb-2">接口类型</label>
                <select
                    id="editProviderType"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                >
                    <option value="openai" selected>OpenAI</option>
                    <option value="openai-completion">OpenAI Completion</option>
                    <option value="azure">Azure OpenAI</option>
                    <option value="anthropic">Anthropic (Claude)</option>
                    <option value="qwen">通义千问</option>
                    <option value="zhipu">智谱 AI</option>
                    <option value="custom">自定义</option>
                </select>
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="hideEditProviderModal()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                    取消
                </button>
                <button onclick="saveEditedProvider()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                    保存供应商
                </button>
            </div>
        </div>
    </div>

    <!-- Delete Provider Modal -->
    <div id="deleteProviderModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-semibold text-gray-800 mb-4">
                <i class="fas fa-trash mr-2 text-red-600"></i>删除供应商
            </h3>
            <div class="mb-4">
                <label for="deleteProviderSelector" class="block text-sm font-semibold text-gray-700 mb-2">选择供应商</label>
                <select
                    id="deleteProviderSelector"
                    onchange="updateDeleteProviderSummary()"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500"
                >
                    <option value="">-- 请选择供应商 --</option>
                </select>
            </div>
            <div id="deleteProviderSummary" class="mb-4 p-3 bg-red-50 border border-red-100 rounded-lg text-sm text-red-700">
                删除供应商会同时删除其下已保存的模型配置。
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="hideDeleteProviderModal()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                    取消
                </button>
                <button onclick="deleteProvider()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                    删除供应商
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentModels = [];
        let currentProviders = [];
        let originalAlias = '';
        let originalProviderAlias = '';
        let currentFormMode = 'edit';

        function getModelDisplayName(model) {
            if (model.display_name) return model.display_name;
            const providerAlias = model.provider_alias || model.alias || '';
            return model.model_name ? `${providerAlias}-${model.model_name}` : providerAlias;
        }

        // 页面加载时获取供应商和模型
        window.addEventListener('DOMContentLoaded', async () => {
            await loadPromptPresets();
            await loadProvidersList();
            await loadModelsList();
        });

        function setLockedVisualState(element, locked) {
            element.classList.toggle('bg-gray-100', locked);
            element.classList.toggle('text-gray-500', locked);
            element.classList.toggle('cursor-not-allowed', locked);
        }

        function setFormMode(mode) {
            currentFormMode = mode;
            const isEditMode = mode === 'edit';

            const providerSelector = document.getElementById('providerSelector');
            const providerAliasInput = document.getElementById('modelAlias');
            const baseUrlInput = document.getElementById('baseUrl');
            const modelProviderSelect = document.getElementById('modelProvider');
            const modelNameInput = document.getElementById('modelName');
            const fetchModelsBtn = document.getElementById('fetchModelsBtn');
            const modelSearch = document.getElementById('modelSearch');
            const deleteModelBtn = document.getElementById('deleteModelBtn');
            const saveModelBtn = document.getElementById('saveModelBtn');

            providerSelector.disabled = isEditMode;
            providerAliasInput.readOnly = true;
            baseUrlInput.readOnly = true;
            modelProviderSelect.disabled = true;
            modelNameInput.readOnly = false;
            fetchModelsBtn.disabled = isEditMode;
            modelSearch.disabled = isEditMode;

            setLockedVisualState(providerSelector, isEditMode);
            setLockedVisualState(providerAliasInput, true);
            setLockedVisualState(baseUrlInput, true);
            setLockedVisualState(modelProviderSelect, true);
            setLockedVisualState(modelNameInput, false);
            setLockedVisualState(fetchModelsBtn, isEditMode);
            setLockedVisualState(modelSearch, isEditMode);

            if (isEditMode) {
                deleteModelBtn.classList.remove('hidden');
                saveModelBtn.innerHTML = '<i class="fas fa-save mr-2"></i>保存模型配置';
            } else {
                deleteModelBtn.classList.add('hidden');
                saveModelBtn.innerHTML = '<i class="fas fa-save mr-2"></i>保存新增模型';
            }
        }

        async function loadProvidersList(selectedAlias = '') {
            try {
                const response = await fetch('/api/models/providers');
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || '供应商加载失败');
                }

                currentProviders = data.providers || [];
                const selector = document.getElementById('providerSelector');
                selector.innerHTML = '<option value="">-- 请选择供应商 --</option>';

                currentProviders.forEach(provider => {
                    const option = document.createElement('option');
                    option.value = provider.alias;
                    option.textContent = provider.alias;
                    selector.appendChild(option);
                });

                if (selectedAlias) {
                    selector.value = selectedAlias;
                    if (currentFormMode === 'add') {
                        fillProviderFields(selectedAlias);
                    }
                }

                refreshEditProviderSelector(selectedAlias);
                refreshDeleteProviderSelector(selectedAlias);
            } catch (error) {
                console.error('加载供应商列表失败:', error);
            }
        }

        // 加载已保存模型列表
        async function loadModelsList() {
            try {
                const response = await fetch('/api/models/list');
                const data = await response.json();
                
                if (data.success) {
                    currentModels = data.models || [];
                    refreshDeleteProviderSelector();
                    const selector = document.getElementById('modelSelector');
                    selector.innerHTML = '<option value="">-- 请选择已保存模型 --</option>';
                    
                    currentModels.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model.alias;
                        option.textContent = getModelDisplayName(model);
                        if (model.alias === data.active_model) {
                            option.textContent += ' (当前使用)';
                            option.selected = true;
                        }
                        selector.appendChild(option);
                    });
                    
                    if (data.active_model && currentFormMode !== 'add') {
                        loadModelConfig();
                    }
                }
            } catch (error) {
                console.error('加载模型列表失败:', error);
            }
        }

        // 加载选中模型的配置
        function loadModelConfig() {
            const alias = document.getElementById('modelSelector').value;
            if (!alias) {
                document.getElementById('configForm').classList.add('hidden');
                return;
            }
            
            const model = currentModels.find(m => m.alias === alias);
            if (model) {
                setFormMode('edit');
                originalAlias = model.alias;
                const providerAlias = model.provider_alias || model.alias;
                document.getElementById('providerSelector').value = providerAlias;
                fillProviderFields(providerAlias, model);
                document.getElementById('apiKey').value = model.api_key;
                document.getElementById('baseUrl').value = model.base_url;
                document.getElementById('modelProvider').value = model.model_provider;
                document.getElementById('modelName').value = model.model_name;
                document.getElementById('maxTokens').value = model.max_tokens || '';
                const temp = model.temperature != null ? model.temperature : '';
                document.getElementById('temperature').value = temp;
                document.getElementById('apiMode').value = model.api_mode || 'auto';
                document.getElementById('reasoningEffort').value = model.reasoning_effort || 'auto';
                document.getElementById('promptCacheTtl').value = model.prompt_cache_ttl || 'auto';
                document.getElementById('serviceTier').value = model.service_tier || 'auto';
                document.getElementById('customPrompt').value = model.custom_prompt || '';
                document.getElementById('configForm').classList.remove('hidden');
                resetAvailableModelsList('已加载保存模型；如需添加其它模型，请点击“增加模型”。');
            }
        }

        function fillProviderFields(providerAlias, fallback = null) {
            const provider = currentProviders.find(p => p.alias === providerAlias) || fallback;
            if (!provider) return;

            originalProviderAlias = providerAlias;
            document.getElementById('modelAlias').value = providerAlias;
            document.getElementById('apiKey').value = provider.api_key || '';
            document.getElementById('baseUrl').value = provider.base_url || '';
            document.getElementById('modelProvider').value = provider.model_provider || 'openai';
        }

        function loadProviderConfig() {
            const providerAlias = document.getElementById('providerSelector').value;
            if (!providerAlias) return;

            fillProviderFields(providerAlias);
            if (currentFormMode === 'add') {
                resetModelEditor();
            }
            document.getElementById('configForm').classList.remove('hidden');
        }

        function resetModelEditor() {
            originalAlias = '';
            document.getElementById('modelSelector').value = '';
            document.getElementById('modelName').value = '';
            document.getElementById('maxTokens').value = '';
            document.getElementById('temperature').value = '';
            document.getElementById('apiMode').value = 'auto';
            document.getElementById('reasoningEffort').value = 'auto';
            document.getElementById('promptCacheTtl').value = 'auto';
            document.getElementById('serviceTier').value = 'auto';
            document.getElementById('customPrompt').value = '';
        }

        function resetAvailableModelsList(message = '请选择供应商后点击“获取模型”按钮，或在左侧手动填写模型 ID') {
            availableModels = [];
            filteredModels = [];
            modelsEmptyMessage = message;
            document.getElementById('modelSearch').value = '';
            document.getElementById('modelsCount').textContent = '';
            document.getElementById('modelsPagination').classList.add('hidden');
            document.getElementById('modelsList').innerHTML = `
                <div class="flex items-center justify-center h-full text-gray-400">
                    <div class="text-center">
                        <i class="fas fa-inbox text-4xl mb-2"></i>
                        <p class="text-sm">${message}</p>
                    </div>
                </div>
            `;
        }

        function startAddModel() {
            if (currentProviders.length === 0) {
                showStatus('请先添加供应商，再为供应商增加模型', 'error');
                showAddModelModal();
                return;
            }

            setFormMode('add');
            originalAlias = '';
            document.getElementById('modelSelector').value = '';
            document.getElementById('providerSelector').value = currentProviders[0].alias;
            fillProviderFields(currentProviders[0].alias);
            resetModelEditor();
            resetAvailableModelsList();
            document.getElementById('configForm').classList.remove('hidden');
            showStatus('请选择供应商，然后点击“获取模型”选择模型，或直接手动填写模型 ID', 'info');
        }

        function getProviderModelCount(providerAlias) {
            return currentModels.filter(model => {
                return (model.provider_alias || model.alias) === providerAlias;
            }).length;
        }

        function refreshEditProviderSelector(selectedAlias = '') {
            const selector = document.getElementById('editProviderSelector');
            if (!selector) return;

            selector.innerHTML = '<option value="">-- 请选择供应商 --</option>';
            currentProviders.forEach(provider => {
                const option = document.createElement('option');
                option.value = provider.alias;
                option.textContent = provider.alias;
                selector.appendChild(option);
            });

            const fallbackAlias = document.getElementById('providerSelector').value || '';
            const nextAlias = selectedAlias || fallbackAlias || (currentProviders[0] && currentProviders[0].alias) || '';
            if (nextAlias && currentProviders.some(provider => provider.alias === nextAlias)) {
                selector.value = nextAlias;
                fillEditProviderFields(nextAlias);
            } else {
                fillEditProviderFields('');
            }
        }

        function showEditProviderModal() {
            if (currentProviders.length === 0) {
                showStatus('暂无可编辑的供应商', 'error');
                return;
            }

            refreshEditProviderSelector();
            document.getElementById('editProviderModal').classList.remove('hidden');
        }

        function hideEditProviderModal() {
            document.getElementById('editProviderModal').classList.add('hidden');
        }

        function fillEditProviderFields(providerAlias) {
            const provider = currentProviders.find(item => item.alias === providerAlias);
            document.getElementById('editProviderAlias').value = provider ? provider.alias : '';
            document.getElementById('editProviderApiKey').value = provider ? provider.api_key || '' : '';
            document.getElementById('editProviderBaseUrl').value = provider ? provider.base_url || '' : '';
            document.getElementById('editProviderType').value = provider ? provider.model_provider || 'openai' : 'openai';
        }

        async function saveEditedProvider() {
            const originalAliasForEdit = document.getElementById('editProviderSelector').value;
            const alias = document.getElementById('editProviderAlias').value.trim();
            const apiKey = document.getElementById('editProviderApiKey').value.trim();
            const baseUrl = document.getElementById('editProviderBaseUrl').value.trim();
            const modelProvider = document.getElementById('editProviderType').value;

            if (!originalAliasForEdit) {
                showStatus('请选择要编辑的供应商', 'error');
                return;
            }
            if (!alias || !apiKey || !baseUrl) {
                showStatus('请填写供应商别名、API Key 和 Base URL', 'error');
                return;
            }

            const wasAddMode = currentFormMode === 'add';
            const selectedModelAlias = document.getElementById('modelSelector').value;

            try {
                const response = await fetch('/api/models/providers/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        original_alias: originalAliasForEdit,
                        alias: alias,
                        api_key: apiKey,
                        base_url: baseUrl,
                        model_provider: modelProvider
                    })
                });

                const result = await response.json();
                if (!result.success) {
                    showStatus('供应商保存失败: ' + result.error, 'error');
                    return;
                }

                hideEditProviderModal();
                originalProviderAlias = alias;
                await loadProvidersList(alias);
                await loadModelsList();

                if (wasAddMode) {
                    setFormMode('add');
                    document.getElementById('providerSelector').value = alias;
                    fillProviderFields(alias);
                    resetModelEditor();
                    resetAvailableModelsList();
                } else if (selectedModelAlias && currentModels.some(model => model.alias === selectedModelAlias)) {
                    document.getElementById('modelSelector').value = selectedModelAlias;
                    loadModelConfig();
                } else if (!document.getElementById('modelSelector').value) {
                    document.getElementById('configForm').classList.add('hidden');
                }

                showStatus('供应商保存成功，相关模型配置已同步更新', 'success');
            } catch (error) {
                showStatus('供应商保存失败: ' + error.message, 'error');
            }
        }

        function refreshDeleteProviderSelector(selectedAlias = '') {
            const selector = document.getElementById('deleteProviderSelector');
            if (!selector) return;

            selector.innerHTML = '<option value="">-- 请选择供应商 --</option>';
            currentProviders.forEach(provider => {
                const option = document.createElement('option');
                option.value = provider.alias;
                option.textContent = provider.alias;
                selector.appendChild(option);
            });

            const fallbackAlias = document.getElementById('providerSelector').value || '';
            const nextAlias = selectedAlias || fallbackAlias;
            if (nextAlias && currentProviders.some(provider => provider.alias === nextAlias)) {
                selector.value = nextAlias;
            }
            updateDeleteProviderSummary();
        }

        function showDeleteProviderModal() {
            if (currentProviders.length === 0) {
                showStatus('暂无可删除的供应商', 'error');
                return;
            }

            refreshDeleteProviderSelector();
            document.getElementById('deleteProviderModal').classList.remove('hidden');
        }

        function hideDeleteProviderModal() {
            document.getElementById('deleteProviderModal').classList.add('hidden');
        }

        function updateDeleteProviderSummary() {
            const selector = document.getElementById('deleteProviderSelector');
            const summary = document.getElementById('deleteProviderSummary');
            if (!selector || !summary) return;

            const providerAlias = selector.value;
            if (!providerAlias) {
                summary.textContent = '删除供应商会同时删除其下已保存的模型配置。';
                return;
            }

            const modelCount = getProviderModelCount(providerAlias);
            summary.textContent = modelCount > 0
                ? `将删除供应商“${providerAlias}”，并同时删除其下 ${modelCount} 个已保存模型配置。`
                : `将删除供应商“${providerAlias}”。该供应商下暂无已保存模型。`;
        }

        async function deleteProvider() {
            const providerAlias = document.getElementById('deleteProviderSelector').value;
            if (!providerAlias) {
                showStatus('请选择要删除的供应商', 'error');
                return;
            }

            const modelCount = getProviderModelCount(providerAlias);
            const confirmMessage = modelCount > 0
                ? `确定要删除供应商“${providerAlias}”吗？\n\n该操作会同时删除其下 ${modelCount} 个已保存模型配置。`
                : `确定要删除供应商“${providerAlias}”吗？`;
            if (!confirm(confirmMessage)) {
                return;
            }

            try {
                const response = await fetch('/api/models/providers/delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({alias: providerAlias})
                });

                const result = await response.json();
                if (!result.success) {
                    showStatus('供应商删除失败: ' + result.error, 'error');
                    return;
                }

                hideDeleteProviderModal();
                originalAlias = '';
                originalProviderAlias = '';
                setFormMode('edit');
                document.getElementById('configForm').classList.add('hidden');
                document.getElementById('modelSelector').value = '';
                await loadProvidersList();
                await loadModelsList();
                resetAvailableModelsList();

                const deletedModels = result.deleted_models || 0;
                const suffix = deletedModels > 0 ? `，并删除 ${deletedModels} 个模型配置` : '';
                showStatus(`供应商删除成功${suffix}`, 'success');
            } catch (error) {
                showStatus('供应商删除失败: ' + error.message, 'error');
            }
        }

        let promptPresets = [];
        let defaultPresetId = 'restructure';

        async function loadPromptPresets() {
            try {
                const response = await fetch('/api/models/prompt_presets');
                const result = await response.json();
                if (result.success && Array.isArray(result.presets)) {
                    promptPresets = result.presets;
                    defaultPresetId = result.default_id || 'restructure';
                }
            } catch (error) {
                console.error('加载默认提示词模板失败:', error);
            }
        }

        function usePromptPreset(presetId) {
            const preset = promptPresets.find(item => item.id === presetId);
            if (!preset) {
                showStatus('默认模板加载失败，请刷新页面后再试', 'error');
                return;
            }
            document.getElementById('customPrompt').value = preset.prompt;
            showStatus(`已填入「${preset.name}」：${preset.description}`, 'success');
        }

        async function saveProviderConfig() {
            const providerAlias = document.getElementById('modelAlias').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const modelProvider = document.getElementById('modelProvider').value;

            if (!providerAlias || !apiKey || !baseUrl) {
                showStatus('请先填写供应商别名、API Key 和 Base URL', 'error');
                return false;
            }

            const response = await fetch('/api/models/providers/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    original_alias: originalProviderAlias || providerAlias,
                    alias: providerAlias,
                    api_key: apiKey,
                    base_url: baseUrl,
                    model_provider: modelProvider
                })
            });

            const result = await response.json();
            if (!result.success) {
                showStatus('供应商保存失败: ' + result.error, 'error');
                return false;
            }

            originalProviderAlias = providerAlias;
            await loadProvidersList(providerAlias);
            return true;
        }

        // 保存模型配置
        document.getElementById('modelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const providerAlias = document.getElementById('modelAlias').value.trim();
            const modelName = document.getElementById('modelName').value.trim();

            if (!providerAlias) {
                showStatus('请先选择供应商', 'error');
                return;
            }

            if (!modelName) {
                showStatus('请填写模型 ID；可以手动输入，或点击“获取模型”后从右侧列表选择', 'error');
                return;
            }
            
            const maxTokensVal = document.getElementById('maxTokens').value;
            const temperatureVal = document.getElementById('temperature').value;
            const existingModel = currentModels.find(model => {
                return (model.provider_alias || model.alias) === providerAlias && model.model_name === modelName;
            });
            const targetAlias = originalAlias || (existingModel && existingModel.alias) || '';

            const formData = {
                original_alias: targetAlias,
                alias: targetAlias || null,
                provider_alias: providerAlias,
                api_key: document.getElementById('apiKey').value,
                base_url: document.getElementById('baseUrl').value,
                model_provider: document.getElementById('modelProvider').value,
                model_name: modelName,
                custom_prompt: document.getElementById('customPrompt').value,
                max_tokens: maxTokensVal ? parseInt(maxTokensVal) : null,
                temperature: temperatureVal !== '' ? parseFloat(temperatureVal) : null,
                api_mode: document.getElementById('apiMode').value,
                reasoning_effort: document.getElementById('reasoningEffort').value,
                prompt_cache_ttl: document.getElementById('promptCacheTtl').value,
                service_tier: document.getElementById('serviceTier').value
            };
            
            try {
                const providerSaved = await saveProviderConfig();
                if (!providerSaved) return;

                const endpoint = targetAlias ? '/api/models/update' : '/api/models/add';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus('模型配置保存成功！', 'success');
                    await loadModelsList();
                    const savedModel = currentModels.find(model => {
                        return (model.provider_alias || model.alias) === providerAlias && model.model_name === modelName;
                    });
                    if (savedModel) {
                        originalAlias = savedModel.alias;
                        document.getElementById('modelSelector').value = savedModel.alias;
                    }
                    loadModelConfig();
                } else {
                    showStatus('保存失败: ' + result.error, 'error');
                }
            } catch (error) {
                showStatus('保存失败: ' + error.message, 'error');
            }
        });

        // 显示添加供应商对话框
        function showAddModelModal() {
            document.getElementById('addModelModal').classList.remove('hidden');
            document.getElementById('newModelAlias').value = '';
            document.getElementById('newProviderApiKey').value = '';
            document.getElementById('newProviderBaseUrl').value = '';
            document.getElementById('newProviderType').value = 'openai';
        }

        // 隐藏添加供应商对话框
        function hideAddModelModal() {
            document.getElementById('addModelModal').classList.add('hidden');
        }

        // 添加供应商
        async function addNewModel() {
            const alias = document.getElementById('newModelAlias').value.trim();
            const apiKey = document.getElementById('newProviderApiKey').value.trim();
            const baseUrl = document.getElementById('newProviderBaseUrl').value.trim();

            if (!alias || !apiKey || !baseUrl) {
                alert('请填写供应商别名、API Key 和 Base URL');
                return;
            }
            
            try {
                const response = await fetch('/api/models/providers/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        alias: alias,
                        api_key: apiKey,
                        base_url: baseUrl,
                        model_provider: document.getElementById('newProviderType').value
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    hideAddModelModal();
                    await loadProvidersList(alias);
                    document.getElementById('configForm').classList.remove('hidden');
                    showStatus('供应商保存成功！可以点击“获取模型”选择模型，也可以手动填写模型 ID', 'success');
                } else {
                    alert('保存失败: ' + result.error);
                }
            } catch (error) {
                alert('保存失败: ' + error.message);
            }
        }

        // 测试连接
        async function testConnection() {
            const testBtn = document.getElementById('testBtn');
            const originalText = testBtn.innerHTML;
            
            testBtn.disabled = true;
            testBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>测试中...';
            
            try {
                const formData = {
                    api_key: document.getElementById('apiKey').value,
                    base_url: document.getElementById('baseUrl').value,
                    model_name: document.getElementById('modelName').value,
                    api_mode: document.getElementById('apiMode').value,
                    reasoning_effort: document.getElementById('reasoningEffort').value,
                    prompt_cache_ttl: document.getElementById('promptCacheTtl').value,
                    service_tier: document.getElementById('serviceTier').value
                };
                
                const response = await fetch('/api/models/test_connection', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus('✓ 连接测试成功！API 配置正常。', 'success', true);
                } else {
                    showStatus('✗ ' + result.error, 'error', true);
                }
            } catch (error) {
                showStatus('✗ 连接测试失败: ' + error.message, 'error', true);
            } finally {
                testBtn.disabled = false;
                testBtn.innerHTML = originalText;
            }
        }

        // 删除模型
        async function deleteModel() {
            const alias = originalAlias || document.getElementById('modelSelector').value;
            const modelName = document.getElementById('modelName').value;
            if (!alias) {
                showStatus('当前没有已保存的模型配置可删除', 'error');
                return;
            }
            if (!confirm(`确定要删除模型配置"${modelName}"吗？`)) {
                return;
            }
            
            try {
                const response = await fetch('/api/models/delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({alias: alias})
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus('模型删除成功！', 'success');
                    document.getElementById('configForm').classList.add('hidden');
                    await loadModelsList();
                } else {
                    showStatus('删除失败: ' + result.error, 'error');
                }
            } catch (error) {
                showStatus('删除失败: ' + error.message, 'error');
            }
        }

        // 隐藏状态消息
        function hideStatus() {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.classList.add('hidden');
        }

        // 显示状态消息
        function showStatus(message, type = 'info', persist = false) {
            const statusDiv = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');
            const statusIcon = document.getElementById('statusIcon');
            const statusContainer = statusDiv.querySelector('div');
            
            statusText.textContent = message;
            
            // 重置样式
            statusContainer.className = 'p-4 rounded-lg border-l-4 flex items-center justify-between';
            statusIcon.className = 'fas mr-3 text-xl';
            
            // 根据类型设置样式和图标
            if (type === 'success') {
                statusContainer.classList.add('bg-green-50', 'border-green-500', 'text-green-800');
                statusIcon.classList.add('fa-check-circle', 'text-green-600');
            } else if (type === 'error') {
                statusContainer.classList.add('bg-red-50', 'border-red-500', 'text-red-800');
                statusIcon.classList.add('fa-exclamation-circle', 'text-red-600');
            } else {
                statusContainer.classList.add('bg-blue-50', 'border-blue-500', 'text-blue-800');
                statusIcon.classList.add('fa-info-circle', 'text-blue-600');
            }
            
            // 显示消息
            statusDiv.classList.remove('hidden');
            
            // 如果不是持久显示，5秒后自动隐藏
            if (!persist) {
                setTimeout(() => {
                    statusDiv.classList.add('hidden');
                }, 5000);
            }
        }

        // 模型列表相关变量
        let availableModels = [];
        let filteredModels = [];
        let currentPage = 1;
        let modelsEmptyMessage = '暂无模型数据，可在左侧手动填写模型 ID';
        const modelsPerPage = 8;

        // 获取模型列表
        async function fetchModelsList() {
            if (currentFormMode !== 'add') {
                showStatus('编辑已保存模型时不加载右侧可选列表；如需添加其它模型，请点击“增加模型”', 'info');
                return;
            }

            if (!document.getElementById('providerSelector').value) {
                showStatus('请先选择供应商', 'error');
                return;
            }

            const apiKey = document.getElementById('apiKey').value;
            const baseUrl = document.getElementById('baseUrl').value;
            
            if (!apiKey || !baseUrl) {
                showStatus('请先填写 API Key 和 Base URL', 'error');
                return;
            }
            
            const fetchBtn = document.getElementById('fetchModelsBtn');
            const originalHTML = fetchBtn.innerHTML;
            
            fetchBtn.disabled = true;
            fetchBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>获取中...';
            
            try {
                const response = await fetch('/api/models/fetch_available', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        api_key: apiKey,
                        base_url: baseUrl,
                        model_provider: document.getElementById('modelProvider').value
                    })
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.error || `HTTP ${response.status}: ${response.statusText}`);
                }

                if (Array.isArray(data.models)) {
                    // 按模型ID首字母排序
                    availableModels = data.models.sort((a, b) => {
                        return a.id.toLowerCase().localeCompare(b.id.toLowerCase());
                    });
                    filteredModels = availableModels;
                    modelsEmptyMessage = availableModels.length > 0
                        ? '暂无模型数据'
                        : '未返回模型数据，可在左侧手动填写模型 ID';
                    currentPage = 1;
                    document.getElementById('modelSearch').value = '';
                    displayModels();
                    showStatus(`成功获取 ${availableModels.length} 个模型`, 'success');
                } else {
                    throw new Error('返回数据格式不正确');
                }
            } catch (error) {
                console.error('获取模型列表失败:', error);
                showStatus(`获取模型列表失败：${error.message}。你仍可手动填写模型 ID 保存`, 'error');
                availableModels = [];
                filteredModels = [];
                modelsEmptyMessage = '模型列表加载失败，可在左侧手动填写模型 ID';
                displayModels();
            } finally {
                fetchBtn.disabled = false;
                fetchBtn.innerHTML = originalHTML;
            }
        }

        // 显示模型列表
        function displayModels() {
            const container = document.getElementById('modelsList');
            const countSpan = document.getElementById('modelsCount');
            const pagination = document.getElementById('modelsPagination');
            
            if (filteredModels.length === 0) {
                container.innerHTML = `
                    <div class="flex items-center justify-center h-full text-gray-400">
                        <div class="text-center">
                            <i class="fas fa-inbox text-4xl mb-2"></i>
                            <p class="text-sm">${availableModels.length > 0 ? '没有匹配的模型' : modelsEmptyMessage}</p>
                        </div>
                    </div>
                `;
                countSpan.textContent = availableModels.length > 0 ? `共 ${availableModels.length} 个模型` : '';
                pagination.classList.add('hidden');
                return;
            }
            
            // 显示所有过滤后的模型，不分页
            container.innerHTML = filteredModels.map(model => {
                const ownerColors = {
                    'openai': 'bg-green-100 text-green-700',
                    'anthropic': 'bg-purple-100 text-purple-700',
                    'vertex-ai': 'bg-blue-100 text-blue-700',
                    'custom': 'bg-gray-100 text-gray-700',
                    'google': 'bg-yellow-100 text-yellow-700',
                    'meta': 'bg-indigo-100 text-indigo-700'
                };
                const colorClass = ownerColors[model.owned_by] || 'bg-gray-100 text-gray-700';
                
                return `
                    <div class="px-3 py-2 border-b border-gray-200 hover:bg-indigo-50 cursor-pointer transition-colors" onclick='selectModel(${JSON.stringify(model.id)})'>
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 flex-1 min-w-0">
                                ${model.owned_by ? `<span class="px-2 py-0.5 rounded text-xs font-medium ${colorClass} whitespace-nowrap">${model.owned_by}</span>` : ''}
                                <p class="text-sm font-medium text-gray-900 truncate">${model.id}</p>
                            </div>
                            <i class="fas fa-chevron-right text-gray-400 text-xs flex-shrink-0"></i>
                        </div>
                    </div>
                `;
            }).join('');
            
            countSpan.textContent = filteredModels.length === availableModels.length 
                ? `共 ${availableModels.length} 个模型` 
                : `显示 ${filteredModels.length} / ${availableModels.length} 个模型`;
            
            // 隐藏分页控件（使用滚动条代替）
            pagination.classList.add('hidden');
        }

        // 过滤模型列表
        function filterModels() {
            const searchTerm = document.getElementById('modelSearch').value.toLowerCase();
            
            if (!searchTerm) {
                filteredModels = availableModels;
            } else {
                filteredModels = availableModels.filter(model => {
                    const modelId = model.id.toLowerCase();
                    const ownedBy = (model.owned_by || '').toLowerCase();
                    return modelId.includes(searchTerm) || ownedBy.includes(searchTerm);
                });
            }
            
            displayModels();
            // 滚动到顶部
            document.getElementById('modelsList').scrollTop = 0;
        }

        // 选择模型
        function selectModel(modelId) {
            const providerAlias = document.getElementById('modelAlias').value.trim();
            const savedModel = currentModels.find(model => {
                return (model.provider_alias || model.alias) === providerAlias && model.model_name === modelId;
            });

            document.getElementById('modelName').value = modelId;
            if (savedModel) {
                setFormMode('edit');
                originalAlias = savedModel.alias;
                document.getElementById('modelSelector').value = savedModel.alias;
                document.getElementById('maxTokens').value = savedModel.max_tokens || '';
                const temp = savedModel.temperature != null ? savedModel.temperature : '';
                document.getElementById('temperature').value = temp;
                document.getElementById('apiMode').value = savedModel.api_mode || 'auto';
                document.getElementById('reasoningEffort').value = savedModel.reasoning_effort || 'auto';
                document.getElementById('promptCacheTtl').value = savedModel.prompt_cache_ttl || 'auto';
                document.getElementById('serviceTier').value = savedModel.service_tier || 'auto';
                document.getElementById('customPrompt').value = savedModel.custom_prompt || '';
                showStatus(`已加载保存过的模型：${getModelDisplayName(savedModel)}`, 'success');
                return;
            }

            originalAlias = '';
            document.getElementById('modelSelector').value = '';
            document.getElementById('maxTokens').value = '';
            document.getElementById('temperature').value = '';
            document.getElementById('apiMode').value = 'auto';
            document.getElementById('reasoningEffort').value = 'auto';
            document.getElementById('promptCacheTtl').value = 'auto';
            document.getElementById('serviceTier').value = 'auto';
            document.getElementById('customPrompt').value = '';
            showStatus(`已选择模型：${modelId}，设置参数和提示词后保存`, 'success');
        }

        // 上一页
        function prevModelsPage() {
            if (currentPage > 1) {
                currentPage--;
                displayModels();
            }
        }

        // 下一页
        function nextModelsPage() {
            const totalPages = Math.ceil(filteredModels.length / modelsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                displayModels();
            }
        }
    </script>
</body>
</html>
